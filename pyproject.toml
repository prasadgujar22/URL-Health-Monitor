[project]
name = "url-health-monitor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "aiohttp>=3.10,<4"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.24"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
